name: Daily research digest

on:
  schedule:
    # 22:40 UTC = 07:40 KST. GitHub cron often starts late, so the job starts
    # early, collects + summarizes, then holds the Slack post until 08:00 KST
    # (settings.post_at in config/sources.yaml).
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't post to Slack, don't save state)"
        type: boolean
        default: false
      backfill:
        description: "Post current items from never-seen sources instead of silently bootstrapping"
        type: boolean
        default: false

permissions:
  contents: write   # to commit state/seen.json back to the repo

concurrency:
  group: research-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and post digest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # higher GitHub API rate limit
        run: |
          ARGS="--json-out digest-run.json"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --wait"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          python -m digest $ARGS

      - name: Save dedupe state
        if: always()
        run: |
          git config user.name "research-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): digest $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: digest-run-${{ github.run_id }}
          path: digest-run.json
          retention-days: 14
          if-no-files-found: ignore
