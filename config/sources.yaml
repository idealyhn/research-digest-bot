# ---------------------------------------------------------------------------
# Research Digest Bot - source configuration
#
# Each source has:
#   id        unique key (used for dedupe state - don't rename casually)
#   org       organization name shown in Slack
#   group     one of the digest sections defined under `groups`
#   type      rss | youtube | arxiv | github_org | huggingface | webpage
#   enabled   (optional, default true)
#   include   (optional) keep only items whose title/summary match ANY of these
#             case-insensitive regexes
#   exclude   (optional) drop items matching ANY of these regexes
#
# The first time a source is seen, all current items are marked as "seen"
# without posting (bootstrap), so day one doesn't flood the channel.
# ---------------------------------------------------------------------------

settings:
  timezone: Asia/Seoul
  post_at: "08:00"            # digest is held until this local time (see README)
  max_age_days: 4             # ignore dated items older than this, even if unseen
  post_when_empty: true       # post a short "nothing new" note on quiet days
  language: English
  llm:
    model: claude-sonnet-5-5  # override with env ANTHROPIC_MODEL
    max_items_for_summary: 60
  # What you care about - used to rank items and pick notable arXiv papers
  interest_profile: >
    Humanoid robots, robot foundation models / vision-language-action (VLA)
    models, whole-body control, dexterous manipulation, sim-to-real and
    large-scale robot simulation, world models for robotics, robot learning
    from human video, and embodied AI announcements from major labs.

groups:
  - key: humanoid
    title: Humanoid Companies
  - key: foundation
    title: Robot Foundation Model Labs
  - key: bigtech
    title: Big Tech AI Research
  - key: arxiv
    title: New arXiv Papers
  - key: code
    title: New Code & Model Releases

