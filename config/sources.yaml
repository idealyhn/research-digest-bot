  # ------------------------------- arXiv papers ------------------------------
  - id: arxiv-robotics
    org: arXiv
    group: arxiv
    type: arxiv
    # cs.RO plus robot-related papers in cs.LG / cs.CV / cs.AI
    query: 'cat:cs.RO OR ((cat:cs.LG OR cat:cs.CV OR cat:cs.AI) AND (abs:robot OR abs:robots OR abs:robotic OR abs:humanoid OR abs:embodied))'
    max_results: 400
    lookback_hours: 120       # arXiv announces with 1-3 day lag; dedupe prevents repeats
    max_age_days: 6
    llm_pick: 6               # also let the LLM pick N notable papers from the rest
    check_affiliations: true  # confirm "weak" mentions via the arXiv HTML author block
    # strong: phrase/domain that almost always means the org's own work
    # weak:   mention that needs confirming (could be "trained on NVIDIA GPUs")
    # affiliation: what to look for in the author/affiliation block (default: org name)
    # authors: arXiv author names (case-insensitive exact match) - edit freely
    watch:
      NVIDIA:
        strong: ['research.nvidia.com', 'nvlabs.github.io', 'nvidia gear', 'gr00t n1']
        weak: ['nvidia', 'gr00t', 'cosmos world', 'isaac lab']
        affiliation: ['nvidia']
        authors: ['Linxi Fan', 'Yuke Zhu', 'Ajay Mandlekar', 'Jan Kautz']
      Google DeepMind:
        strong: ['deepmind.google', 'gemini robotics', 'google deepmind robotics']
        weak: ['deepmind', 'google research']
        affiliation: ['deepmind', 'google']
      Meta AI (FAIR):
        strong: ['ai.meta.com', 'fair at meta', 'meta fair']
        weak: ['meta ai', 'v-jepa']
        affiliation: ['meta', 'fair']
      OpenAI:
        weak: ['openai']
        affiliation: ['openai']
      Figure AI:
        strong: ['figure.ai', 'figure ai']
        affiliation: ['figure ai']
      Tesla Optimus:
        strong: ['tesla optimus']
        affiliation: ['tesla']
      1X:
        strong: ['1x technologies', '1x.tech']
        affiliation: ['1x technologies']
      Boston Dynamics:
        strong: ['boston dynamics']
        weak: ['atlas humanoid', 'spot robot']
        affiliation: ['boston dynamics', 'rai institute']
      Agility Robotics:
        strong: ['agility robotics']
        weak: ['digit humanoid']
        affiliation: ['agility robotics']
      Unitree:
        weak: ['unitree']
        affiliation: ['unitree']
      Physical Intelligence:
        strong: ['physical intelligence', 'pi.website', 'physicalintelligence.company']
        weak: ['π0', 'π0.5', 'pi0', 'pi_0', 'openpi']
        affiliation: ['physical intelligence']
        authors: ['Sergey Levine', 'Chelsea Finn', 'Karol Hausman', 'Brian Ichter']
      Skild AI:
        strong: ['skild']
        affiliation: ['skild']
        authors: ['Deepak Pathak', 'Abhinav Gupta']
      Toyota Research Institute:
        strong: ['toyota research institute', 'tri.global']
        weak: ['large behavior model']
        affiliation: ['toyota research']
        authors: ['Russ Tedrake', 'Benjamin Burchfiel']

